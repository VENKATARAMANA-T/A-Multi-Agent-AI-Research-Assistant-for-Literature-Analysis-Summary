server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60M;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vite emits the PDF.js worker as .mjs, which nginx's mime.types still does
    # not know: it went out as application/octet-stream and the browser refused
    # to run it ("Failed to fetch dynamically imported module"), so the reader
    # could not open a single PDF. `types { }` clears the inherited map for this
    # location so default_type decides. A regex location beats the /assets/
    # prefix above, which is why the cache headers are repeated.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Proxy the API to the backend container so the browser sees one origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent runs and report generation are slow by nature.
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
